<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CMS Việt Nam Quốc Tự</title>
    <link rel="stylesheet" href="/static/admin.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">VNQ</div>
          <div>
            <small>Admin CMS</small>
            <h1>Việt Nam Quốc Tự</h1>
          </div>
        </div>

        <div id="loginPanel" class="panel">
          <h2>Đăng nhập</h2>
          <form id="loginForm">
            <label>
              Tên đăng nhập
              <input type="text" name="login" value="admin" required />
            </label>
            <label>
              Mật khẩu
              <input type="password" name="password" value="Admin123!@#2024" required />
            </label>
            <button type="submit" class="primary">Đăng nhập</button>
          </form>
        </div>

        <div id="dashboardPanel" class="panel hidden">
          <button id="logoutBtn" class="ghost" type="button">Đăng xuất</button>
          <button id="reloadBtn" class="secondary" type="button">Tải lại dữ liệu</button>
        </div>
      </aside>

      <main class="main-panel">
        <section class="hero">
          <div>
            <p class="eyebrow">Quản lý nội dung và POI</p>
            <h2>Danh sách điểm tham quan</h2>
          </div>
        </section>

        <section class="card form-card">
          <h3>Thêm POI mới</h3>
          <form id="poiForm">
            <div class="grid two-cols">
              <label>
                Tiêu đề VI
                <input type="text" name="title_vi" required />
              </label>
              <label>
                Tiêu đề EN
                <input type="text" name="title_en" />
              </label>
            </div>

            <div class="grid two-cols">
              <label>
                Mô tả VI
                <textarea name="description_vi" rows="3" required></textarea>
              </label>
              <label>
                Mô tả EN
                <textarea name="description_en" rows="3"></textarea>
              </label>
            </div>

            <div class="grid four-cols">
              <label>
                Vĩ độ
                <input type="number" step="0.000001" name="latitude" required />
              </label>
              <label>
                Kinh độ
                <input type="number" step="0.000001" name="longitude" required />
              </label>
              <label>
                Bán kính (m)
                <input type="number" min="5" max="100" name="geofence_radius" value="25" required />
              </label>
              <label>
                Loại vị trí
                <select name="location_type">
                  <option value="OUTDOOR">OUTDOOR</option>
                  <option value="INDOOR">INDOOR</option>
                </select>
              </label>
            </div>

            <div class="actions">
              <button type="submit" class="primary">Lưu POI</button>
            </div>
          </form>
        </section>

        <section class="card list-card">
          <div class="list-header">
            <h3>Dữ liệu hiện tại</h3>
            <span id="poiCount">0 POI</span>
          </div>
          <div id="poiTable" class="poi-table"></div>
        </section>
      </main>
    </div>

    <script src="/static/admin.js"></script>
  </body>
</html>
